name: Update flight data

on:
  schedule:
    - cron: "0 1 * * *"   # daily 08:00 Vietnam time (Aviationstack free = 100 calls/month)
  workflow_dispatch:       # "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python flights.py
        env:
          AIRLABS_KEY: ${{ secrets.AIRLABS_KEY }}
          AVIATIONSTACK_KEY: ${{ secrets.AVIATIONSTACK_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data.json
          git commit -m "Update flight data" || echo "No changes"
          git push
