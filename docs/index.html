<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Departures Board</title>
<style>
  :root {
    --bg: #eef2f9;
    --bg-mesh:
      radial-gradient(900px 420px at 12% -5%, rgba(37, 99, 235, 0.16), transparent 65%),
      radial-gradient(850px 420px at 88% 0%, rgba(14, 165, 233, 0.14), transparent 65%),
      radial-gradient(700px 400px at 50% 100%, rgba(99, 102, 241, 0.08), transparent 70%);
    --grid-line: rgba(37, 99, 235, 0.045);
    --card: rgba(255, 255, 255, 0.92);
    --card-solid: #ffffff;
    --card-subtle: #f8fafc;
    --text: #0f172a;
    --text-secondary: #334155;
    --muted: #64748b;
    --line: #e2e8f0;
    --line-strong: #cbd5e1;
    --accent: #2563eb;
    --accent-2: #4f46e5;
    --accent-3: #0ea5e9;
    --accent-grad: linear-gradient(135deg, #2563eb 0%, #4f46e5 55%, #0284c7 100%);
    --accent-soft: rgba(37, 99, 235, 0.12);
    --accent-text: #ffffff;

    --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 10px 30px -6px rgba(15, 23, 42, 0.08), 0 4px 12px -4px rgba(15, 23, 42, 0.05);
    --shadow-accent: 0 10px 24px -4px rgba(37, 99, 235, 0.38), 0 4px 10px -2px rgba(79, 70, 229, 0.25);

    --row-hover: #f1f5f9;
    --board-head: #f1f5f9;
    --flap-bg: #0f172a;
    --flap-text: #f8fafc;

    /* Status Pill Colors - Light */
    --s-active-bg: linear-gradient(135deg, #dbeafe 0%, #e0f2fe 100%);
    --s-active-border: #93c5fd;
    --s-active-text: #1d4ed8;
    --s-active-dot: #2563eb;

    --s-landed-bg: linear-gradient(135deg, #dcfce7 0%, #d1fae5 100%);
    --s-landed-border: #86efac;
    --s-landed-text: #15803d;
    --s-landed-dot: #16a34a;

    --s-scheduled-bg: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
    --s-scheduled-border: #cbd5e1;
    --s-scheduled-text: #334155;
    --s-scheduled-dot: #64748b;

    --s-cancelled-bg: linear-gradient(135deg, #fee2e2 0%, #ffe4e6 100%);
    --s-cancelled-border: #fca5a5;
    --s-cancelled-text: #b91c1c;
    --s-cancelled-dot: #ef4444;

    --delay-warn-bg: linear-gradient(135deg, #fef3c7 0%, #ffedd5 100%);
    --delay-warn-border: #fcd34d;
    --delay-warn-text: #b45309;

    --delay-ok-bg: rgba(16, 185, 129, 0.1);
    --delay-ok-border: rgba(16, 185, 129, 0.28);
    --delay-ok-text: #047857;

    --err-bg: linear-gradient(135deg, #fef2f2 0%, #fff1f2 100%);
    --err-border: #fecaca;
    --err-text: #b91c1c;

    --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #070b14;
      --bg-mesh:
        radial-gradient(950px 460px at 15% -8%, rgba(37, 99, 235, 0.26), transparent 65%),
        radial-gradient(850px 420px at 88% -4%, rgba(14, 165, 233, 0.2), transparent 65%),
        radial-gradient(800px 450px at 50% 105%, rgba(99, 102, 241, 0.14), transparent 70%);
      --grid-line: rgba(56, 189, 248, 0.04);
      --card: rgba(17, 24, 39, 0.88);
      --card-solid: #111827;
      --card-subtle: #162033;
      --text: #f8fafc;
      --text-secondary: #cbd5e1;
      --muted: #94a3b8;
      --line: #1e293b;
      --line-strong: #334155;
      --accent: #3b82f6;
      --accent-2: #6366f1;
      --accent-3: #0ea5e9;
      --accent-grad: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #0284c7 100%);
      --accent-soft: rgba(59, 130, 246, 0.2);
      --accent-text: #ffffff;

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 14px 34px -6px rgba(0, 0, 0, 0.55);
      --shadow-accent: 0 10px 28px -4px rgba(37, 99, 235, 0.5), 0 0 15px rgba(14, 165, 233, 0.25);

      --row-hover: rgba(30, 41, 59, 0.65);
      --board-head: #0f172a;
      --flap-bg: #1e293b;
      --flap-text: #38bdf8;

      --s-active-bg: rgba(37, 99, 235, 0.2);
      --s-active-border: rgba(96, 165, 250, 0.4);
      --s-active-text: #93c5fd;
      --s-active-dot: #60a5fa;

      --s-landed-bg: rgba(22, 163, 74, 0.2);
      --s-landed-border: rgba(74, 222, 128, 0.38);
      --s-landed-text: #86efac;
      --s-landed-dot: #4ade80;

      --s-scheduled-bg: rgba(148, 163, 184, 0.14);
      --s-scheduled-border: rgba(148, 163, 184, 0.28);
      --s-scheduled-text: #e2e8f0;
      --s-scheduled-dot: #94a3b8;

      --s-cancelled-bg: rgba(220, 38, 38, 0.22);
      --s-cancelled-border: rgba(248, 113, 113, 0.4);
      --s-cancelled-text: #fca5a5;
      --s-cancelled-dot: #f87171;

      --delay-warn-bg: rgba(245, 158, 11, 0.18);
      --delay-warn-border: rgba(251, 191, 36, 0.4);
      --delay-warn-text: #fcd34d;

      --delay-ok-bg: rgba(16, 185, 129, 0.14);
      --delay-ok-border: rgba(52, 211, 153, 0.3);
      --delay-ok-text: #6ee7b7;

      --err-bg: rgba(185, 28, 28, 0.2);
      --err-border: rgba(248, 113, 113, 0.4);
      --err-text: #fca5a5;
    }
  }

  :root[data-theme="dark"] {
    --bg: #070b14;
    --bg-mesh:
      radial-gradient(950px 460px at 15% -8%, rgba(37, 99, 235, 0.26), transparent 65%),
      radial-gradient(850px 420px at 88% -4%, rgba(14, 165, 233, 0.2), transparent 65%),
      radial-gradient(800px 450px at 50% 105%, rgba(99, 102, 241, 0.14), transparent 70%);
    --grid-line: rgba(56, 189, 248, 0.04);
    --card: rgba(17, 24, 39, 0.88);
    --card-solid: #111827;
    --card-subtle: #162033;
    --text: #f8fafc;
    --text-secondary: #cbd5e1;
    --muted: #94a3b8;
    --line: #1e293b;
    --line-strong: #334155;
    --accent: #3b82f6;
    --accent-2: #6366f1;
    --accent-3: #0ea5e9;
    --accent-grad: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #0284c7 100%);
    --accent-soft: rgba(59, 130, 246, 0.2);
    --accent-text: #ffffff;

    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 14px 34px -6px rgba(0, 0, 0, 0.55);
    --shadow-accent: 0 10px 28px -4px rgba(37, 99, 235, 0.5), 0 0 15px rgba(14, 165, 233, 0.25);

    --row-hover: rgba(30, 41, 59, 0.65);
    --board-head: #0f172a;
    --flap-bg: #1e293b;
    --flap-text: #38bdf8;

    --s-active-bg: rgba(37, 99, 235, 0.2);
    --s-active-border: rgba(96, 165, 250, 0.4);
    --s-active-text: #93c5fd;
    --s-active-dot: #60a5fa;

    --s-landed-bg: rgba(22, 163, 74, 0.2);
    --s-landed-border: rgba(74, 222, 128, 0.38);
    --s-landed-text: #86efac;
    --s-landed-dot: #4ade80;

    --s-scheduled-bg: rgba(148, 163, 184, 0.14);
    --s-scheduled-border: rgba(148, 163, 184, 0.28);
    --s-scheduled-text: #e2e8f0;
    --s-scheduled-dot: #94a3b8;

    --s-cancelled-bg: rgba(220, 38, 38, 0.22);
    --s-cancelled-border: rgba(248, 113, 113, 0.4);
    --s-cancelled-text: #fca5a5;
    --s-cancelled-dot: #f87171;

    --delay-warn-bg: rgba(245, 158, 11, 0.18);
    --delay-warn-border: rgba(251, 191, 36, 0.4);
    --delay-warn-text: #fcd34d;

    --delay-ok-bg: rgba(16, 185, 129, 0.14);
    --delay-ok-border: rgba(52, 211, 153, 0.3);
    --delay-ok-text: #6ee7b7;

    --err-bg: rgba(185, 28, 28, 0.2);
    --err-border: rgba(248, 113, 113, 0.4);
    --err-text: #fca5a5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      var(--bg-mesh),
      linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
    background-size: 100% 100%, 36px 36px, 36px 36px;
    background-attachment: fixed;
    color: var(--text);
    font: 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  main {
    max-width: 1160px;
    margin: 0 auto;
    padding: 28px 18px 56px;
  }

  /* ==================== HERO HEADER ==================== */
  .top-header {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 22px 24px;
    margin-bottom: 22px;
    border-radius: 20px;
    background: var(--card);
    backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-md);
  }

  .top-header::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--accent-grad);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand-icon {
    width: 54px;
    height: 54px;
    border-radius: 16px;
    background: var(--accent-grad);
    color: #fff;
    display: grid;
    place-items: center;
    box-shadow: var(--shadow-accent);
    flex-shrink: 0;
    position: relative;
  }

  .brand-icon::after {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 19px;
    border: 1.5px solid rgba(59, 130, 246, 0.35);
    pointer-events: none;
  }

  .brand-icon svg {
    width: 28px;
    height: 28px;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.15;
    background: linear-gradient(135deg, var(--text) 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: rgba(16, 185, 129, 0.14);
    color: #10b981;
    border: 1px solid rgba(16, 185, 129, 0.35);
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
    animation: pulse-green 2s infinite;
  }

  @keyframes pulse-green {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.65); }
    70% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 5px;
  }

  .header-meta svg {
    width: 14px;
    height: 14px;
    color: var(--accent);
    flex-shrink: 0;
  }

  .muted {
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Theme Button */
  .theme-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    font-size: 13.5px;
    font-weight: 600;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: linear-gradient(180deg, var(--card-solid) 0%, var(--card-subtle) 100%);
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .theme-btn:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 6px 16px -4px rgba(37, 99, 235, 0.22);
  }

  .theme-btn:active {
    transform: translateY(0);
  }

  .theme-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px;
  }

  /* ==================== BASE BUTTONS & BARS ==================== */
  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin: 18px 0;
  }

  button {
    font: inherit;
    padding: 9px 16px;
    border: 1px solid var(--line);
    background: var(--card-solid);
    color: var(--text);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  button:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(0);
  }

  button[aria-pressed="true"] {
    background: var(--accent-grad);
    border-color: transparent;
    color: var(--accent-text);
    box-shadow: var(--shadow-accent);
  }

  /* ==================== AIRPORT BOARDING-PASS CARDS ==================== */
  #airports {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin: 0 0 22px;
  }

  #airports button {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    border-radius: 16px;
    border: 1.5px solid var(--line);
    background: linear-gradient(145deg, var(--card-solid) 0%, var(--card-subtle) 100%);
    text-align: left;
    box-shadow: var(--shadow-sm);
  }

  #airports button::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 5px;
    background: var(--line-strong);
    transition: background 0.2s ease, width 0.2s ease;
  }

  #airports button:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
  }

  #airports button:hover::before {
    background: var(--accent);
  }

  #airports button[aria-pressed="true"] {
    background: var(--accent-grad);
    border-color: rgba(255, 255, 255, 0.25);
    color: #fff;
    box-shadow: var(--shadow-accent);
    transform: translateY(-2px);
  }

  #airports button[aria-pressed="true"]::before {
    background: #38bdf8;
    width: 6px;
  }

  .ap-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .ap-plane {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    transition: all 0.2s ease;
  }

  .ap-plane svg {
    width: 20px;
    height: 20px;
  }

  #airports button[aria-pressed="true"] .ap-plane {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
  }

  .ap-text {
    min-width: 0;
  }

  .ap-code-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ap-code {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.04em;
    line-height: 1.1;
  }

  .ap-tag {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--accent-soft);
    color: var(--accent);
  }

  #airports button[aria-pressed="true"] .ap-tag {
    background: rgba(255, 255, 255, 0.22);
    color: #fff;
  }

  .ap-city {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
    display: block;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #airports button[aria-pressed="true"] .ap-city {
    color: rgba(255, 255, 255, 0.88);
  }

  .ap-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .ap-badge {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 800;
    padding: 4px 11px;
    border-radius: 999px;
    background: var(--card-subtle);
    border: 1px solid var(--line);
    color: var(--text);
  }

  #airports button[aria-pressed="true"] .ap-badge {
    background: rgba(255, 255, 255, 0.22);
    border-color: rgba(255, 255, 255, 0.35);
    color: #fff;
  }

  .ap-flights-lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-top: 3px;
    font-weight: 600;
  }

  #airports button[aria-pressed="true"] .ap-flights-lbl {
    color: rgba(255, 255, 255, 0.8);
  }

  /* ==================== TELEMETRY INFO CARD ==================== */
  .card {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-md);
  }

  .info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 12px;
    padding: 18px;
  }

  .info > div {
    position: relative;
    overflow: hidden;
    padding: 12px 14px;
    background: linear-gradient(180deg, var(--card-solid) 0%, var(--card-subtle) 100%);
    border: 1px solid var(--line);
    border-radius: 14px;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .info > div:hover {
    transform: translateY(-2px);
    border-color: var(--line-strong);
  }

  .info > div::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--accent-grad);
    opacity: 0.65;
  }

  .info > div:first-child {
    grid-column: span 2;
    background: linear-gradient(135deg, var(--accent-soft) 0%, var(--card-solid) 100%);
    border-color: rgba(37, 99, 235, 0.28);
  }

  .info > div:first-child::after {
    opacity: 1;
  }

  .info-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 5px;
  }

  .info-head svg {
    width: 14px;
    height: 14px;
    color: var(--accent);
    flex-shrink: 0;
  }

  .info b {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    font-weight: 700;
  }

  .info .val {
    font-weight: 700;
    color: var(--text);
    font-size: 15px;
    word-break: break-word;
    display: block;
  }

  .info > div:first-child .val {
    font-size: 16.5px;
    font-weight: 800;
  }

  .info .val-mono {
    font-family: var(--mono);
    font-size: 15.5px;
    color: var(--accent);
  }

  /* ==================== CONTROLS BAR (SOURCES, SEARCH, STATUS) ==================== */
  .controls-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    padding: 12px;
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow-sm);
    margin: 20px 0;
  }

  #sources {
    display: inline-flex;
    background: var(--card-subtle);
    padding: 5px;
    border-radius: 13px;
    border: 1px solid var(--line);
    gap: 6px;
  }

  #sources button {
    border: 1px solid transparent;
    background: transparent;
    padding: 8px 16px;
    border-radius: 9px;
    font-size: 13.5px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-secondary);
    box-shadow: none;
  }

  #sources button:hover {
    color: var(--text);
    background: rgba(148, 163, 184, 0.12);
    transform: none;
  }

  #sources button[aria-pressed="true"] {
    background: var(--accent-grad);
    color: #fff;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
  }

  #sources button svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }

  #sources button .src-count {
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 700;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--card-solid);
    border: 1px solid var(--line);
    color: var(--text);
  }

  #sources button[aria-pressed="true"] .src-count {
    background: rgba(255, 255, 255, 0.22);
    border-color: rgba(255, 255, 255, 0.35);
    color: #fff;
  }

  .search-wrap {
    flex: 1;
    min-width: 220px;
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    width: 17px;
    height: 17px;
    color: var(--accent);
    pointer-events: none;
  }

  input, select {
    font: inherit;
    padding: 10px 14px;
    border: 1.5px solid var(--line);
    background: var(--card-solid);
    color: var(--text);
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    transition: all 0.18s ease;
  }

  input:hover, select:hover {
    border-color: var(--line-strong);
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  #q {
    width: 100%;
    padding-left: 40px;
    font-weight: 500;
  }

  .select-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
  }

  .select-wrap svg {
    position: absolute;
    left: 12px;
    width: 15px;
    height: 15px;
    color: var(--accent);
    pointer-events: none;
  }

  #status {
    min-width: 185px;
    padding-left: 36px;
    cursor: pointer;
    font-weight: 600;
  }

  /* ==================== DEPARTURES BOARD & TABLE ==================== */
  .board-card {
    padding: 0;
    overflow: hidden;
    border-radius: 20px;
  }

  .board-toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--card-solid) 0%, var(--card-subtle) 100%);
  }

  .count-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .count-icon {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid;
    place-items: center;
  }

  .count-icon svg {
    width: 16px;
    height: 16px;
  }

  #count {
    font-weight: 700;
    color: var(--text);
    font-size: 14px;
  }

  .stats-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .stat-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 4px 11px;
    border-radius: 999px;
    background: var(--card-solid);
    border: 1px solid var(--line);
    color: var(--muted);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }

  .stat-chip .chip-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }

  .stat-chip strong {
    color: var(--text);
    font-family: var(--mono);
    font-size: 12.5px;
  }

  .err {
    color: var(--err-text);
    background: var(--err-bg);
    border-bottom: 1px solid var(--err-border);
    padding: 14px 20px;
    font-size: 13.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .err:empty {
    display: none;
  }

  .scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th, td {
    text-align: left;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }

  th {
    background: var(--board-head);
    color: var(--muted);
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 2px solid var(--line);
  }

  tbody tr {
    transition: background-color 0.15s ease;
  }

  tbody tr:hover {
    background: var(--row-hover);
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  /* Flight Split-Flap Badge */
  .flight-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 4px 10px;
    border-radius: 8px;
    background: var(--flap-bg);
    color: var(--flap-text);
    font-family: var(--mono);
    font-weight: 800;
    font-size: 13.5px;
    letter-spacing: 0.05em;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 2px 4px rgba(0, 0, 0, 0.12);
  }

  .flight-badge svg {
    width: 13px;
    height: 13px;
    color: #38bdf8;
    flex-shrink: 0;
  }

  /* Airline Color Badge */
  .airline-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 12.5px;
    padding: 4px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card-subtle);
    color: var(--text);
  }

  .airline-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Route Airports */
  .airport-origin {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
    color: var(--muted);
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--card-subtle);
    border: 1px dashed var(--line-strong);
  }

  .airport-dest {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-weight: 800;
    color: var(--accent);
    font-size: 14px;
    padding: 3px 10px;
    border-radius: 8px;
    background: var(--accent-soft);
  }

  .airport-dest svg {
    width: 13px;
    height: 13px;
  }

  /* Time Cells */
  .time-cell {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-secondary);
  }

  .time-cell .time-hm {
    font-weight: 800;
    color: var(--text);
    font-size: 14.5px;
  }

  .time-cell .time-date {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--card-subtle);
    border: 1px solid var(--line);
  }

  /* Status Pills */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    text-transform: capitalize;
    background: var(--s-scheduled-bg);
    border: 1px solid var(--s-scheduled-border);
    color: var(--s-scheduled-text);
  }

  .pill::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--s-scheduled-dot);
  }

  .s-active, .s-en-route {
    background: var(--s-active-bg);
    border-color: var(--s-active-border);
    color: var(--s-active-text);
  }
  .s-active::before, .s-en-route::before {
    background: var(--s-active-dot);
    box-shadow: 0 0 6px var(--s-active-dot);
  }

  .s-landed {
    background: var(--s-landed-bg);
    border-color: var(--s-landed-border);
    color: var(--s-landed-text);
  }
  .s-landed::before {
    background: var(--s-landed-dot);
  }

  .s-scheduled {
    background: var(--s-scheduled-bg);
    border-color: var(--s-scheduled-border);
    color: var(--s-scheduled-text);
  }
  .s-scheduled::before {
    background: var(--s-scheduled-dot);
  }

  .s-cancelled, .s-incident, .s-diverted {
    background: var(--s-cancelled-bg);
    border-color: var(--s-cancelled-border);
    color: var(--s-cancelled-text);
  }
  .s-cancelled::before, .s-incident::before, .s-diverted::before {
    background: var(--s-cancelled-dot);
  }

  /* Delay Badges */
  .delay-badge {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--delay-warn-bg);
    border: 1px solid var(--delay-warn-border);
    color: var(--delay-warn-text);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .delay-ontime {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--delay-ok-bg);
    border: 1px solid var(--delay-ok-border);
    color: var(--delay-ok-text);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  /* Empty State */
  .empty-cell {
    text-align: center;
    padding: 56px 20px !important;
    white-space: normal !important;
  }

  .empty-box {
    max-width: 360px;
    margin: 0 auto;
    color: var(--muted);
  }

  .empty-icon-wrap {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid;
    place-items: center;
    margin: 0 auto 14px;
  }

  .empty-icon-wrap svg {
    width: 28px;
    height: 28px;
  }

  .empty-title {
    font-weight: 800;
    font-size: 16px;
    color: var(--text);
    margin-bottom: 6px;
  }

  .empty-sub {
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .reset-btn {
    font-size: 13px;
    padding: 8px 18px;
    border-radius: 999px;
    font-weight: 700;
    background: var(--accent-grad);
    color: #fff;
    border: none;
    box-shadow: var(--shadow-accent);
  }

  /* ==================== MOBILE RESPONSIVE (375px) ==================== */
  @media (max-width: 640px) {
    main {
      padding: 14px 10px 36px;
    }

    .top-header {
      padding: 16px;
      border-radius: 16px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
    }

    h1 {
      font-size: 20px;
    }

    #airports {
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    #airports button {
      padding: 12px 10px;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      border-radius: 14px;
    }

    .ap-plane, .ap-city, .ap-tag, .ap-flights-lbl {
      display: none;
    }

    .ap-code {
      font-size: 17px;
    }

    .ap-right {
      align-items: flex-start;
    }

    .ap-badge {
      font-size: 12px;
      padding: 2px 8px;
    }

    .info {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 12px;
    }

    .info > div:first-child {
      grid-column: 1 / -1;
    }

    .controls-bar {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 10px;
    }

    #sources {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    #sources button {
      justify-content: center;
      padding: 8px 10px;
    }

    .search-wrap, .select-wrap, #status {
      width: 100%;
    }

    .board-toolbar {
      padding: 12px 14px;
    }

    th, td {
      padding: 11px 12px;
      font-size: 13px;
    }
  }
</style>
</head>
<body>
<main>
  <header class="top-header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
        </svg>
      </div>
      <div>
        <div class="title-row">
          <h1>Flight Board</h1>
          <span class="live-badge"><span class="live-dot"></span>LIVE</span>
        </div>
        <div class="header-meta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          <div class="muted" id="updated">Loading…</div>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="theme-btn" id="themeToggle" aria-label="Toggle color theme">
        <span class="theme-icon" id="themeIcon">☀</span>
        <span id="themeLabel">Light Mode</span>
      </button>
    </div>
  </header>

  <div class="bar" id="airports" role="group" aria-label="Airport"></div>

  <div class="card info" id="info"></div>

  <div class="bar controls-bar">
    <div role="group" aria-label="Data source" id="sources">
      <button type="button" data-src="airlabs">AirLabs</button>
      <button type="button" data-src="aviationstack">Aviationstack</button>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="q" type="search" placeholder="Search flight, airline or destination (e.g. VN, HAN, SIN)…" aria-label="Search">
    </div>
    <div class="select-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
      </svg>
      <select id="status" aria-label="Status"><option value="">All statuses</option></select>
    </div>
  </div>

  <div class="card board-card">
    <div class="board-toolbar">
      <div class="count-wrap">
        <div class="count-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 22h20"/><path d="M6.36 17.4 4 17l-2-4 1.1-.55a2 2 0 0 1 1.8 0l.17.1a2 2 0 0 0 1.8 0L8 12 5 6l.9-.45a2 2 0 0 1 2.09.2l4.02 3a2 2 0 0 0 2.1.2l4.19-2.06a2.41 2.41 0 0 1 1.73-.17L21 7a1.4 1.4 0 0 1 .87 1.99l-.38.76c-.23.46-.6.84-1.07 1.08L7.58 17.2a2 2 0 0 1-1.22.2Z"/>
          </svg>
        </div>
        <div class="muted" id="count"></div>
      </div>
      <div class="stats-pills" id="statsPills"></div>
    </div>
    <div class="err" id="err" role="alert"></div>
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>Flight</th>
            <th>Airline</th>
            <th>From</th>
            <th>To</th>
            <th>Departure</th>
            <th>Arrival</th>
            <th>Status</th>
            <th>Delay</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const state = { airport: "SGN", src: "airlabs", q: "", status: "" };
let data;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const AIRLINE_COLORS = [
  "#2563eb", "#0ea5e9", "#8b5cf6", "#ec4899", "#f59e0b",
  "#10b981", "#ef4444", "#14b8a6", "#6366f1", "#f97316"
];

function airlineColor(code) {
  const s = String(code || "");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AIRLINE_COLORS[h % AIRLINE_COLORS.length];
}

function formatTime(t) {
  if (!t) return "—";
  const str = String(t).trim();
  const parts = str.split(" ");
  if (parts.length === 2) {
    return `<span class="time-hm">${esc(parts[1])}</span><span class="time-date">${esc(parts[0].slice(5))}</span>`;
  }
  return esc(str);
}

function formatType(t) {
  if (!t) return "—";
  return String(t).replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}

const INFO_ICONS = {
  "Airport": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg>`,
  "IATA": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
  "ICAO": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="7" y1="16" x2="12" y2="16"/></svg>`,
  "Type": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
  "Latitude": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
  "Longitude": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>`,
  "Elevation (ft)": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>`
};

function render() {
  if (!data || !data.airports) return;
  const ap = data.airports[state.airport];
  if (!ap) return;
  const i = ap.info || {};

  $("info").innerHTML = [
    ["Airport", i.name, false],
    ["IATA", i.iata_code, true],
    ["ICAO", i.icao_code, true],
    ["Type", formatType(i.type), false],
    ["Latitude", i.latitude, true],
    ["Longitude", i.longitude, true],
    ["Elevation (ft)", i.elevation, true]
  ].map(([k, v, mono]) => `<div>
    <div class="info-head">${INFO_ICONS[k] || ""}<b>${k}</b></div>
    <span class="val ${mono ? "val-mono" : ""}">${esc(v ?? "—")}</span>
  </div>`).join("");

  for (const b of document.querySelectorAll("#airports button")) {
    const code = b.dataset.code;
    b.setAttribute("aria-pressed", code === state.airport);
    const badge = b.querySelector(".ap-badge");
    if (badge && data.airports[code]) {
      badge.textContent = (data.airports[code][state.src] || []).length;
    }
  }

  for (const b of document.querySelectorAll("#sources button")) {
    const srcKey = b.dataset.src;
    const srcCount = Array.isArray(ap[srcKey]) ? ap[srcKey].length : 0;
    const label = srcKey === "airlabs" ? "AirLabs" : "Aviationstack";
    const icon = srcKey === "airlabs"
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>`;
    b.innerHTML = `${icon}<span>${label}</span><span class="src-count">${srcCount}</span>`;
    b.setAttribute("aria-pressed", srcKey === state.src);
  }

  const all = ap[state.src] || [];
  const statuses = [...new Set(all.map(f => f.status).filter(Boolean))].sort();
  $("status").innerHTML = `<option value="">All statuses</option>` + statuses.map(s => `<option value="${esc(s)}" ${s === state.status ? "selected" : ""}>${esc(s)}</option>`).join("");

  const q = state.q.trim().toLowerCase();
  const rows = all.filter(f => (!state.status || f.status === state.status) &&
    (!q || [f.flight, f.airline, f.to].some(v => (v || "").toLowerCase().includes(q))));

  $("count").textContent = `${rows.length} of ${all.length} departures from ${state.airport}`;

  const delayedCount = rows.filter(f => Number(f.delay) > 0).length;
  const activeCount = rows.filter(f => f.status === "active" || f.status === "en-route").length;
  const onTimeCount = rows.length - delayedCount;
  $("statsPills").innerHTML = rows.length ? `
    <span class="stat-chip"><span class="chip-dot" style="background:#3b82f6"></span>Active: <strong>${activeCount}</strong></span>
    <span class="stat-chip"><span class="chip-dot" style="background:#10b981"></span>On Time: <strong>${onTimeCount}</strong></span>
    <span class="stat-chip"><span class="chip-dot" style="background:#f59e0b"></span>Delayed: <strong>${delayedCount}</strong></span>
  ` : "";

  const errMsg = ap.errors && ap.errors[state.src];
  $("err").textContent = errMsg ? `Error: ${errMsg}` : "";

  if (rows.length === 0) {
    const hasFilter = Boolean(state.q || state.status);
    $("rows").innerHTML = `<tr><td colspan="8" class="empty-cell">
      <div class="empty-box">
        <div class="empty-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
          </svg>
        </div>
        <div class="empty-title">No matching departures</div>
        <div class="empty-sub">${hasFilter ? "No flights match your current search or status filter." : "No departure records available for this data source."}</div>
        ${hasFilter ? `<button type="button" class="reset-btn" id="resetFilters">Reset all filters</button>` : ""}
      </div>
    </td></tr>`;
    const resetBtn = $("resetFilters");
    if (resetBtn) {
      resetBtn.onclick = () => {
        state.q = "";
        state.status = "";
        $("q").value = "";
        $("status").value = "";
        render();
      };
    }
    return;
  }

  $("rows").innerHTML = rows.map(f => {
    const statusSlug = String(f.status || "scheduled").toLowerCase().replace(/[^a-z0-9-]+/g, "-");
    const delayHtml = f.delay
      ? `<span class="delay-badge">⚠ +${esc(f.delay)} min</span>`
      : `<span class="delay-ontime">✓ On time</span>`;
    const color = airlineColor(f.airline);
    return `<tr>
      <td>
        <b class="flight-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
          ${esc(f.flight || "—")}
        </b>
      </td>
      <td>
        <span class="airline-tag">
          <span class="airline-dot" style="background:${color}"></span>
          ${esc(f.airline || "—")}
        </span>
      </td>
      <td><span class="airport-origin">${esc(state.airport)}</span></td>
      <td>
        <span class="airport-dest">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          ${esc(f.to || "—")}
        </span>
      </td>
      <td class="time-cell">${formatTime(f.dep_time)}</td>
      <td class="time-cell">${formatTime(f.arr_time)}</td>
      <td><span class="pill s-${esc(statusSlug)}">${esc(f.status || "unknown")}</span></td>
      <td>${delayHtml}</td>
    </tr>`;
  }).join("");
}

/* Theme switcher supporting system default + manual toggle */
(function initTheme() {
  const root = document.documentElement;
  const btn = $("themeToggle");
  const label = $("themeLabel");
  const icon = $("themeIcon");
  const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");

  function isDarkActive() {
    const attr = root.getAttribute("data-theme");
    if (attr === "dark") return true;
    if (attr === "light") return false;
    return darkQuery.matches;
  }

  function updateThemeButton() {
    const dark = isDarkActive();
    icon.textContent = dark ? "☀" : "☾";
    label.textContent = dark ? "Light Mode" : "Dark Mode";
  }

  btn.onclick = () => {
    const next = isDarkActive() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    updateThemeButton();
  };

  if (darkQuery.addEventListener) {
    darkQuery.addEventListener("change", updateThemeButton);
  }
  updateThemeButton();
})();

fetch("data.json", { cache: "no-cache" }).then(r => r.json()).then(d => {
  data = d;
  const codes = Object.keys(d.airports || {});
  if (codes.length && !d.airports[state.airport]) {
    state.airport = codes[0];
  }
  $("updated").textContent = "Last updated: " + new Date(d.updated).toLocaleString();
  $("airports").innerHTML = codes.map(c => {
    const ap = d.airports[c] || {};
    const name = (ap.info && ap.info.name) ? ap.info.name.replace(/International Airport/i, "").trim() : "";
    const icao = (ap.info && ap.info.icao_code) ? ap.info.icao_code : "IATA";
    const total = Array.isArray(ap[state.src]) ? ap[state.src].length : 0;
    return `<button type="button" data-code="${esc(c)}">
      <span class="ap-left">
        <span class="ap-plane" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 22h20"/><path d="M6.36 17.4 4 17l-2-4 1.1-.55a2 2 0 0 1 1.8 0l.17.1a2 2 0 0 0 1.8 0L8 12 5 6l.9-.45a2 2 0 0 1 2.09.2l4.02 3a2 2 0 0 0 2.1.2l4.19-2.06a2.41 2.41 0 0 1 1.73-.17L21 7a1.4 1.4 0 0 1 .87 1.99l-.38.76c-.23.46-.6.84-1.07 1.08L7.58 17.2a2 2 0 0 1-1.22.2Z"/>
          </svg>
        </span>
        <span class="ap-text">
          <span class="ap-code-row">
            <span class="ap-code">${esc(c)}</span>
            <span class="ap-tag">${esc(icao)}</span>
          </span>
          ${name ? `<span class="ap-city">${esc(name)}</span>` : ""}
        </span>
      </span>
      <span class="ap-right">
        <span class="ap-badge">${total}</span>
        <span class="ap-flights-lbl">Flights</span>
      </span>
    </button>`;
  }).join("");

  $("airports").onclick = e => {
    const btn = e.target.closest("button[data-code]");
    if (btn && btn.dataset.code) {
      state.airport = btn.dataset.code;
      state.status = "";
      render();
    }
  };
  $("sources").onclick = e => {
    const btn = e.target.closest("button[data-src]");
    if (btn && btn.dataset.src) {
      state.src = btn.dataset.src;
      state.status = "";
      render();
    }
  };
  $("q").oninput = e => { state.q = e.target.value; render(); };
  $("status").onchange = e => { state.status = e.target.value; render(); };
  render();
}).catch(e => { $("updated").textContent = "Could not load data.json: " + e; });
</script>
</body>
</html>
